name: Release

# Builds the package and publishes it with PyPI trusted publishing (no token in the repository).
# - Manual run (Actions -> Release -> Run workflow): build and upload to TestPyPI only, as a rehearsal.
# - Tag v<version> (e.g. v0.1.1; V0.1.1 works as well): build, TestPyPI, then PyPI. The "pypi" environment requires the maintainer's
#   approval, so nothing reaches PyPI without it. A version on PyPI can never be uploaded again.

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Tag matches the package version
        if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import rope_protocol; print(rope_protocol.__version__)")
          tag=$(echo "$GITHUB_REF_NAME" | sed 's/^V/v/')
          test "v$version" = "$tag" || { echo "tag $GITHUB_REF_NAME does not match version $version (tag the commit that sets the version)"; exit 1; }
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the package
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rope-protocol
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: testpypi
    if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rope-protocol
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
