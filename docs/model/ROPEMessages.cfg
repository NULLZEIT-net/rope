\* TLC configuration of ROPEMessages.tla: one message over the network and offline media at the same time, up to 3
\* breaks (link drops, crashes of the recipient or the hub). About 220,000 distinct states.
SPECIFICATION Spec
CONSTANTS
    Msgs = {m1}
    MaxBreaks = 3
    Media = TRUE
INVARIANTS
    TypeOK
    CustodyChain
    ToldAtMostOnce
PROPERTIES
    CustodyKept
    EventuallyToldAndReported
