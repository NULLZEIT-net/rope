\* TLC configuration of ROPEStream.tla: a file of up to 3 bytes, a window of 2, up to 2 breaks (disconnects and
\* crashes), sticks at any time. About 340,000 distinct states; under a minute on a laptop.
SPECIFICATION Spec
CONSTANTS
    MaxLen = 3
    Window = 2
    MaxBreaks = 2
INVARIANTS
    TypeOK
    StoredCorrectly
    NoInvention
    AckedIsStored
    VerifiedIsWhole
    ResultIsTrue
    NeverMismatch
PROPERTIES
    StoreOnlyGrows
    EventuallyVerified
