\* TLC configuration of ROPEMessages.tla: two messages at the same time over the network, up to 2 breaks. Offline
\* media are left out here: with two messages and sticks the state space grows beyond what a laptop checks quickly.
SPECIFICATION Spec
CONSTANTS
    Msgs = {m1, m2}
    MaxBreaks = 2
    Media = FALSE
INVARIANTS
    TypeOK
    CustodyChain
    ToldAtMostOnce
PROPERTIES
    CustodyKept
    EventuallyToldAndReported
