[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-protocol"
dynamic = ["version"]
description = "ROPE - Resumable Offline Protocol for Emergencies"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Fankhauser" }]
keywords = ["resumable", "transfer", "offline", "custody", "radio", "store-and-forward"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/NULLZEIT-net/rope"
Specification = "https://github.com/NULLZEIT-net/rope/blob/main/docs/spec.md"
Changelog = "https://github.com/NULLZEIT-net/rope/blob/main/CHANGELOG.md"
Issues = "https://github.com/NULLZEIT-net/rope/issues"

[tool.setuptools.dynamic]
version = { attr = "rope_protocol.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# network tests: print every thread's stack instead of hanging silently
faulthandler_timeout = 120
